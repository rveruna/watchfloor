name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Check the shape of the code
        run: npm run arch
      - run: npm run test:coverage
      - run: npm run build
      - name: Build both ways of running the app for the end-to-end run
        run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility checks
        run: npm run e2e
