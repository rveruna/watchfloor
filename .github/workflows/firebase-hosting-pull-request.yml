name: Firebase Hosting preview

on: pull_request

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # a pull request from a fork, or from Dependabot, has no access to the deploy key
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WATCHFLOOR_RVERUNA }}
          projectId: watchfloor-rveruna
          expires: 14d
